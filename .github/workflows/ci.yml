name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # weekly: fuzzing, new vulnerabilities and new versions of Runnel

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Lint Windows code (GOOS=windows)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.15.0
      - name: No dependencies (plugins would inherit them and their licenses)
        run: make deps

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Test
        run: go test -race ./...

  runnel:
    name: Test against Runnel (main, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: runnelhq/runnel
          path: runnel
      - uses: actions/setup-go@v7
        with:
          go-version-file: runnel/go.mod
          check-latest: true
      - name: Build Runnel (without editor)
        run: cd runnel && go build -o "bin/runnel$(go env GOEXE)" ./cmd/runnel
      - name: Test the example plugin in Runnel
        run: |
          bin="$PWD/runnel/bin/runnel$(go env GOEXE)"
          # On Windows, Go needs a Windows path, not the one of Git Bash.
          if command -v cygpath >/dev/null; then bin="$(cygpath -m "$bin")"; fi
          RUNNEL_BIN="$bin" go test -count=1 -run WithRunnel ./...

  api:
    name: API compatible with the last release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: apidiff against the last tag
        run: make api

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    name: Fuzz (weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Fuzz the protocol, batches and configuration (5 minutes each)
        run: make fuzz FUZZTIME=5m
